name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查 + 前端构建
        run: |
          npm run typecheck
          npm run build

      - name: 构建 Windows 单文件版
        run: npm run tauri build -- --no-bundle

      - name: 列出产物（核对文件名）
        shell: pwsh
        run: Get-ChildItem src-tauri\target\release\*.exe | Select-Object Name, Length

      # 关键自检：在 Windows 构建机上真的启动一次，跑不起来就直接在日志里报出来。
      # continue-on-error：CI 环境没有真桌面，这一步只作参考，不阻塞出包。
      - name: 启动自检（真跑一次 + 倒出应用日志）
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "src-tauri\target\release\coolapk-windows.exe"
          $err = "src-tauri\target\release\_startup_err.txt"
          $out = "src-tauri\target\release\_startup_out.txt"
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardError $err -RedirectStandardOutput $out
          Start-Sleep -Seconds 25
          $p.Refresh()
          $started = -not $p.HasExited     # 必须在杀掉进程之前判断
          if ($p.HasExited) {
            Write-Host "!! 启动失败：进程已退出，退出码 = $($p.ExitCode)"
          } else {
            Write-Host "OK 启动成功：20 秒后进程仍存活，PID = $($p.Id)"
            Stop-Process -Id $p.Id -Force
          }
          Write-Host "--- 崩溃/报错原文（stderr）"
          Get-Content $err -Tail 80 -ErrorAction SilentlyContinue
          Write-Host "--- 标准输出"
          Get-Content $out -Tail 30 -ErrorAction SilentlyContinue
          Write-Host "--- exe 同目录的启动追踪日志"
          Get-Content "src-tauri\target\release\coolapk-windows-启动日志.txt" -Tail 80 -ErrorAction SilentlyContinue
          foreach ($base in @($env:LOCALAPPDATA, $env:APPDATA)) {
            $dir = Join-Path $base "com.coolapk.windows"
            Write-Host "--- 查找日志目录: $dir"
            if (Test-Path $dir) {
              Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue |
                Select-Object -First 12 |
                ForEach-Object {
                  Write-Host "== $($_.FullName) ($($_.Length) 字节)"
                  Get-Content $_.FullName -Tail 40 -ErrorAction SilentlyContinue
                }
            }
          }
          # 起不来就标记失败：Release 步骤会据此拒绝发布（本步 continue-on-error，不阻塞出包）
          if (-not $started) { exit 1 }

      - name: 上传单文件 exe（Actions 产物，需登录才能下载）
        uses: actions/upload-artifact@v4
        with:
          name: coolapk-windows-portable
          path: src-tauri/target/release/coolapk-windows.exe
          if-no-files-found: error

      - name: 发布 Release（仅打 v* tag 时）
        if: startsWith(github.ref, 'refs/tags/v') && steps.smoke.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: 酷安 Windows 单文件版 ${{ github.ref_name }}
          files: src-tauri/target/release/coolapk-windows.exe
          draft: false
          prerelease: false
          body: |
            Windows **免安装单文件版**，双击即用（系统需已有 WebView2 Runtime）。

            界面为**自有实现**：三栏布局 + 双列信息流，左右栏可隐藏；
            顶栏左上角为酷安 logo 与名称，右上角为通知 / 私信、主题与账号入口；
            发布按钮是内容区底部居中的悬浮毛玻璃钮（可按住拖动）。
            构建链路：源码 → 云端自动编译（GitHub Actions）→ 单文件 exe。

            本项目基于 daimiaopeng/coolapk-desktop（MIT 许可证）改造。
            非官方客户端，与酷安官方无隶属或合作关系；酷安名称与商标归其权利人所有。

  # Android 打包需要四个签名 Secret；缺失时跳过 Android 构建（Release 只有 Windows exe）。
  android-signing-check:
    name: 检查 Android 签名 Secrets
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_signing: ${{ steps.check.outputs.has_signing }}
    steps:
      - name: 探测签名 Secrets
        id: check
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "Android 签名 Secrets 已配置，将构建 Android APK。"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "缺少 Android 签名 Secrets，本次跳过 Android APK 构建。" >&2
          fi

  android-build:
    name: Android ARM64 APK
    needs: [android-signing-check]
    if: needs.android-signing-check.outputs.has_signing == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 缓存 Gradle 依赖
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 平台与 NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-aarch64
          cache-on-failure: true

      - name: 安装前端依赖
        run: npm ci

      - name: 同步标签版本号
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm run version:set -- ${GITHUB_REF_NAME#v}

      - name: 准备 Android 签名
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coolapk-windows-upload.jks"

      - name: 构建签名 APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/coolapk-windows-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:build -- --target aarch64 --apk --ci

      - name: 校验 APK 签名与版本号
        shell: bash
        run: |
          apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          test -f "$apk"
          # minSdk >= 24 时 apksigner 默认不验证 v1，按 API 23 验证才能检查 v1/v2 是否都存在。
          verification="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 23 "$apk")"
          printf '%s\n' "$verification"
          grep -Fqx 'Verified using v1 scheme (JAR signing): true' <<< "$verification"
          grep -Fqx 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$verification"
          expected_version="$(node -p 'require("./package.json").version')"
          expected_code="$(node -p 'require("./src-tauri/tauri.conf.json").bundle.android.versionCode')"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep '^package:' \
            | grep -F "versionName='$expected_version'" | grep -F "versionCode='$expected_code'"

      - name: 上传 APK（Actions 产物，需登录才能下载）
        uses: actions/upload-artifact@v4
        with:
          name: coolapk-windows-android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error

  publish-android:
    name: 发布 Android APK 到 Release
    needs: [windows, android-build]
    if: startsWith(github.ref, 'refs/tags/v') && needs.android-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: coolapk-windows-android
          path: android-release

      - name: 上传到 GitHub Release（启动自检未过则无 Release，直接失败）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $tag 不存在：Windows 启动自检未通过，未发布；Android APK 不单独发版" >&2
            exit 1
          fi
          # 命名必须匹配更新检测正则 coolapk-v?[0-9].+-android-arm64.apk（前端 updateChecker 与 Android 端校验共用）
          cp "android-release/app-universal-release.apk" "android-release/coolapk-${tag}-android-arm64.apk"
          gh release upload "$tag" "android-release/coolapk-${tag}-android-arm64.apk" --repo "$GITHUB_REPOSITORY" --clobber
          echo "已上传 coolapk-${tag}-android-arm64.apk"
