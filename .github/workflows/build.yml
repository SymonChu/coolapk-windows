name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查 + 前端构建
        run: |
          npm run typecheck
          npm run build

      - name: 构建 Windows 单文件版
        run: npm run tauri build -- --no-bundle

      - name: 列出产物（核对文件名）
        shell: pwsh
        run: Get-ChildItem src-tauri\target\release\*.exe | Select-Object Name, Length

      # 关键自检：在 Windows 构建机上真的启动一次，跑不起来就直接在日志里报出来。
      # continue-on-error：CI 环境没有真桌面，这一步只作参考，不阻塞出包。
      - name: 启动自检（真跑一次 + 倒出应用日志）
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "src-tauri\target\release\coolapk-windows.exe"
          $err = "src-tauri\target\release\_startup_err.txt"
          $out = "src-tauri\target\release\_startup_out.txt"
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardError $err -RedirectStandardOutput $out
          Start-Sleep -Seconds 25
          $p.Refresh()
          $started = -not $p.HasExited     # 必须在杀掉进程之前判断
          if ($p.HasExited) {
            Write-Host "!! 启动失败：进程已退出，退出码 = $($p.ExitCode)"
          } else {
            Write-Host "OK 启动成功：20 秒后进程仍存活，PID = $($p.Id)"
            Stop-Process -Id $p.Id -Force
          }
          Write-Host "--- 崩溃/报错原文（stderr）"
          Get-Content $err -Tail 80 -ErrorAction SilentlyContinue
          Write-Host "--- 标准输出"
          Get-Content $out -Tail 30 -ErrorAction SilentlyContinue
          Write-Host "--- exe 同目录的启动追踪日志"
          Get-Content "src-tauri\target\release\coolapk-windows-启动日志.txt" -Tail 80 -ErrorAction SilentlyContinue
          foreach ($base in @($env:LOCALAPPDATA, $env:APPDATA)) {
            $dir = Join-Path $base "com.coolapk.windows"
            Write-Host "--- 查找日志目录: $dir"
            if (Test-Path $dir) {
              Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue |
                Select-Object -First 12 |
                ForEach-Object {
                  Write-Host "== $($_.FullName) ($($_.Length) 字节)"
                  Get-Content $_.FullName -Tail 40 -ErrorAction SilentlyContinue
                }
            }
          }
          # 起不来就标记失败：Release 步骤会据此拒绝发布（本步 continue-on-error，不阻塞出包）
          if (-not $started) { exit 1 }

      - name: 上传单文件 exe（Actions 产物，需登录才能下载）
        uses: actions/upload-artifact@v4
        with:
          name: coolapk-windows-portable
          path: src-tauri/target/release/coolapk-windows.exe
          if-no-files-found: error

      - name: 发布 Release（仅打 v* tag 时）
        if: startsWith(github.ref, 'refs/tags/v') && steps.smoke.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: 酷安 Windows 单文件版 ${{ github.ref_name }}
          files: src-tauri/target/release/coolapk-windows.exe
          draft: false
          prerelease: false
          body: |
            Windows **免安装单文件版**，双击即用（系统需已有 WebView2 Runtime）。

            本版为**工程底座版**：已打通「源码 → 云端自动编译 → 单文件 exe」全流程，
            界面采用参考项目 daimiaopeng/coolapk-desktop（MIT）的原界面，
            自有界面（三栏 + 双列信息流 + 左右栏可隐藏）尚在接入中。

            非官方客户端，与酷安官方无隶属或合作关系；酷安名称与商标归其权利人所有。
