name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查 + 前端构建
        run: |
          npm run typecheck
          npm run build

      - name: 构建 Windows 单文件版
        run: npm run tauri build -- --no-bundle

      - name: 列出产物（核对文件名）
        shell: pwsh
        run: Get-ChildItem src-tauri\target\release\*.exe | Select-Object Name, Length

      - name: 上传单文件 exe
        uses: actions/upload-artifact@v4
        with:
          name: coolapk-windows-portable
          path: src-tauri/target/release/coolapk-windows.exe
          if-no-files-found: error
