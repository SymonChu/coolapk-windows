name: build-windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查 + 前端构建
        run: |
          npm run typecheck
          npm run build

      - name: 构建 Windows 单文件版
        run: npm run tauri build -- --no-bundle

      - name: 列出产物（核对文件名）
        shell: pwsh
        run: Get-ChildItem src-tauri\target\release\*.exe | Select-Object Name, Length

      - name: 上传单文件 exe（Actions 产物，需登录才能下载）
        uses: actions/upload-artifact@v4
        with:
          name: coolapk-windows-portable
          path: src-tauri/target/release/coolapk-windows.exe
          if-no-files-found: error

      - name: 发布 Release（仅打 v* tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 酷安 Windows 单文件版 ${{ github.ref_name }}
          files: src-tauri/target/release/coolapk-windows.exe
          draft: false
          prerelease: false
          body: |
            Windows **免安装单文件版**，双击即用（系统需已有 WebView2 Runtime）。

            本版为**工程底座版**：已打通「源码 → 云端自动编译 → 单文件 exe」全流程，
            界面采用参考项目 daimiaopeng/coolapk-desktop（MIT）的原界面，
            自有界面（三栏 + 双列信息流 + 左右栏可隐藏）尚在接入中。

            非官方客户端，与酷安官方无隶属或合作关系；酷安名称与商标归其权利人所有。
